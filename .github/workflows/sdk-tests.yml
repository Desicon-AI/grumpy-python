name: SDK contract tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests build
      - run: python -B -m unittest discover -s tests -v
      - run: python -m build
      - run: python -c "from zipfile import ZipFile; z=ZipFile('dist/desicon_seal-1.0.5-py3-none-any.whl'); assert 'seal/__init__.py' in z.namelist(); assert not any(n.startswith('grumpy_ai/') for n in z.namelist())"
      - uses: actions/upload-artifact@v4
        with:
          name: seal-python-candidate
          path: dist/desicon_seal-1.0.5*
